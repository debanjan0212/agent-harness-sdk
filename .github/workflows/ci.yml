name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python: ["3.11", "3.12", "3.13"]}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[all,dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q   # includes the repo-wide no-f-string scan
      - name: offline demos
        working-directory: examples
        run: |
          for s in bad-deploy db-pool injection; do python -m incident_commander demo --scenario $s --approve auto; done

  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e . pytest pytest-asyncio
      - run: pytest -q   # framework tests skip; the core must work with no extras

  crewai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[crewai,dev]"
      - run: pytest -q tests/test_crewai.py

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/incident-commander
      - run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          helm template ic deploy/helm/incident-commander --set alertmanager.enabled=true | ./kubeconform -strict -summary -ignore-missing-schemas
      - run: docker build -t incident-commander .
