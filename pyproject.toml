[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-sdk"
version = "0.1.0"
description = "A harness for building production agents: read, analyse, decide, act, with guardrails, approvals and automatic OpenTelemetry MELT. DeepSeek by default, any model or framework."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Debanjan Das"}]
keywords = ["agents", "llm", "deepseek", "opentelemetry", "sre", "mcp", "langchain"]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
langchain = ["langchain-core>=0.3"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
crewai = ["crewai>=0.80"]
llamaindex = ["llama-index-core>=0.12"]
openai-agents = ["openai-agents>=0.2"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
all = ["agent-harness-sdk[mcp,langchain,langgraph,llamaindex,openai-agents,server]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
agent-harness = "agent_harness_sdk.cli:main"

[tool.setuptools.packages.find]
include = ["agent_harness_sdk*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# G = flake8-logging-format (no f-strings / .format / % in log calls), LOG = logging hygiene
select = ["E", "F", "I", "B", "UP", "BLE", "G", "LOG", "T20"]
ignore = ["UP031", "UP032"]  # we deliberately use %-style and str.format instead of f-strings

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["T20"]
"agent_harness_sdk/cli.py" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
